apiVersion: apps/v1
kind: Deployment

metadata:
  name: productcatalogservice
  namespace: freshmart
  labels:
    app: productcatalogservice

spec:
  replicas: 1
  selector:
    matchLabels:
      app: productcatalogservice

  template:
    metadata:
      labels:
        app: productcatalogservice

    spec:
      containers:
        - name: productcatalogservice
          image: productcatalogservice:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3550