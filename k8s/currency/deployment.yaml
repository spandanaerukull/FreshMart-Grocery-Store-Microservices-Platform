
apiVersion: apps/v1
kind: Deployment

metadata:
  name: currencyservice
  namespace: freshmart
  labels:
    app: currencyservice

spec:
  replicas: 1
  selector:
    matchLabels:
      app: currencyservice

  template:
    metadata:
      labels:
        app: currencyservice

    spec:
      containers:
        - name: currencyservice
          image: currencyservice:v4
          
          imagePullPolicy: Never
          ports:
            - containerPort: 7000
          env:
            - name: DISABLE_PROFILER
              value: "1"
            - name: PORT
              value: "7000"