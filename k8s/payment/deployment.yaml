apiVersion: apps/v1
kind: Deployment

metadata:
  name: paymentservice
  namespace: freshmart
  labels:
    app: paymentservice

spec:
  replicas: 1
  selector:
    matchLabels:
      app: paymentservice

  template:
    metadata:
      labels:
        app: paymentservice

    spec:
      containers:
        - name: paymentservice
          image: paymentservice:v4
          imagePullPolicy: Never
          ports:
            - containerPort: 50051
          env:
             - name: PORT
               value: "50051"
             - name: DISABLE_PROFILER
               value: "1"
             - name: DISABLE_TRACING
               value: "1"