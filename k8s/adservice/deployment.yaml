apiVersion: apps/v1
kind: Deployment

metadata:
  name: adservice
  namespace: freshmart
  labels:
    app: adservice

spec:
  replicas: 1
  selector:
    matchLabels:
      app: adservice

  template:
    metadata:
      labels:
        app: adservice

    spec:
      containers:
        - name: adservice
          image: adservice:local
          imagePullPolicy: Never
          ports:
            - containerPort: 9555